<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="FarmRise Tycoon - build a farm, work it, and grow an agricultural empire."
    />
    <title>FarmRise Tycoon</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1014;
        overflow: hidden;
      }
      /* The canvas is sized in CSS pixels; the renderer owns the device-pixel ratio. */
      #app {
        position: fixed;
        inset: 0;
      }
      #app > canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>FarmRise Tycoon needs JavaScript and WebGL to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
